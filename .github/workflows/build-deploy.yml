name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *" # daily; RePEc crawls roughly daily too
  workflow_dispatch:

# Least privilege by default; each job widens only what it uses.  In
# particular `build` must not hold id-token: write -- nothing there
# mints an OIDC token, and that job runs whatever requirements.txt
# resolves to.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # The Zenodo fetch bounds itself (see FETCH_DEADLINE in ideawp/zenodo.py);
    # this is a backstop for a wedged runner, not for a slow Zenodo.
    timeout-minutes: 20
    permissions:
      contents: write # to commit papers.yaml ledger updates
      pages: write # configure-pages
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the ledger push can rebase onto a moved main.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest tests/ -q
      - name: Build site (fetch Zenodo, emit ReDIF + index)
        run: python -m ideawp.build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      # After the artifact upload: a push failure must not cost a deploy
      # that was built from good data.
      - name: Commit ledger updates
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          if git diff --quiet papers.yaml; then
            echo "ledger unchanged"
            exit 0
          fi
          git config user.name "idea-wp-pipeline"
          git config user.email "actions@users.noreply.github.com"
          git add papers.yaml
          git commit -m "Update paper ledger"
          # checkout pins origin/main to the event SHA, so a run that
          # queued behind another is pushing from a stale base.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            echo "push rejected (attempt $attempt); rebasing onto origin/main"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error title=Ledger push conflicted::papers.yaml moved on main during this run; the next scheduled build regenerates it from the ledger."
              exit 1
            fi
          done
          echo "::error title=Ledger push failed::Could not push papers.yaml after 3 attempts."
          exit 1

  deploy:
    needs: build
    # Never publish a branch build to the production Pages site: a
    # workflow_dispatch can be aimed at any ref.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Outside deploy-pages' own 10-minute timeout, so that action reports
    # the failure first; this only catches a wedged job, which would
    # otherwise hold the `pages` concurrency group for the 6-hour default.
    timeout-minutes: 15
    permissions:
      contents: read # job-level permissions replace the workflow block
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
