name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *" # daily; RePEc crawls roughly daily too
  workflow_dispatch:

permissions:
  contents: write # to commit papers.yaml ledger updates
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest tests/ -q
      - name: Build site (fetch Zenodo, emit ReDIF + index)
        run: python -m ideawp.build
      - name: Commit ledger updates
        run: |
          if ! git diff --quiet papers.yaml; then
            git config user.name "idea-wp-pipeline"
            git config user.email "actions@users.noreply.github.com"
            git add papers.yaml
            git commit -m "Update paper ledger"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
